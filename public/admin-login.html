<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="rowser" content="width=device-width, initial-scale=1.0"/>
  <title>تسجيل دخول المسؤول</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', Tahoma, sans-serif; background: #f8f9fa; }
    .login-card { max-width: 400px; margin: 100px auto; }
  </style>
</head>
<body>
  <div class="login-card card p-4 shadow">
    <h3 class="text-center mb-4">لوحة تحكم المسؤول</h3>
    <div class="mb-3">
      <label for="password" class="form-label">كلمة المرور</label>
      <input type="password" id="password" class="form-control" placeholder="أدخل كلمة المرور" />
    </div>
    <button id="login-btn" class="btn btn-primary w-100">تسجيل الدخول</button>
    <div id="error-message" class="text-danger mt-2" style="display:none;"></div>
  </div>

  <script>
    document.getElementById('login-btn').addEventListener('click', async () => {
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-message');
      
      if (!password) {
        errorDiv.textContent = 'يرجى إدخال كلمة المرور';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/admin-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();
        
        if (data.success) {
          localStorage.setItem('adminSessionId', data.sessionId);
          window.location.href = 'admin.html';
        } else {
          errorDiv.textContent = data.error || 'فشل تسجيل الدخول';
          errorDiv.style.display = 'block';
        }
      } catch (err) {
        errorDiv.textContent = 'فشل الاتصال بالخادم';
        errorDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
