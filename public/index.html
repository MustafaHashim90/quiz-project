<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مسابقة الطلاب - الكلية التقنية الهندسية كركوك</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- خط Cairo من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href=" https://fonts.gstatic.com " crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- ملف الأنماط -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="container py-4">
    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="card p-4 shadow text-center">
      <h2 class="mb-4">مسابقة الطلاب</h2>
      <form id="login-form">
        <div class="mb-3 text-end">
          <label for="full-name" class="form-label">الاسم الثلاثي الكامل</label>
          <input type="text" id="full-name" class="form-control" required placeholder="مثال: أحمد محمد علي" dir="rtl"/>
        </div>
        <div class="mb-3 text-end">
          <label for="department" class="form-label">القسم</label>
          <input type="text" id="department" class="form-control" required placeholder="مثال: البيئة والتلوث" dir="rtl" />
        </div>
        <div class="mb-3 text-end">
          <label for="grade" class="form-label">المرحلة الدراسية</label>
          <select id="grade" class="form-select text-end" required dir="rtl">
            <option value="">اختر المرحلة</option>
            <option value="1">المرحلة الأولى</option>
            <option value="2">المرحلة الثانية</option>
            <option value="3">المرحلة الثالثة</option>
            <option value="4">المرحلة الرابعة</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">بدء المسابقة</button>
      </form>
    </div>

    <!-- شاشة تحميل الأسئلة -->
    <div id="load-screen" class="card p-4 shadow text-center d-none">
      <h3 class="mb-3">جارٍ تحميل الأسئلة  ...</h3>
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <!-- شاشة الأسئلة -->
    <div id="quiz-container" class="card p-4 shadow d-none">
      <h2 class="text-center mb-4">السؤال <span id="q-number">1</span> من <span id="q-total">25</span></h2>
      <div id="timer" class="text-end mb-3 text-danger fw-bold">الوقت: <span id="time-left">60</span> ثانية</div>
      <div id="question" class="h5 mb-4"></div>
      <div id="options" class="mb-4"></div>
      <div class="d-flex justify-content-between">
        <button id="prev-btn" class="btn btn-outline-secondary" disabled>السابق</button>
        <button id="next-btn" class="btn btn-primary">التالي</button>
      </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="final-result" class="card p-4 shadow mt-4 d-none text-center">
      <h3>النتيجة النهائية</h3>
      <p><strong>الاسم:</strong> <span id="result-name"></span></p>
      <p><strong>القسم:</strong> <span id="result-dept"></span></p>
      <p><strong>المرحلة:</strong> <span id="result-grade"></span></p>
      <p><strong>المجموع:</strong> <span id="result-score"></span> / <span id="total-possible"></span></p>
      <p><strong>الوقت المستغرق:</strong> <span id="result-time"></span> ثانية</p>
      <button id="export-btn" class="btn btn-danger mt-3">انهاء الاختبار والخروج </button>
    </div>
  </div>

  <!-- الفوتر الموحّد -->
  <footer class="text-center py-3 bg-light border-top mt-4">
    <p class="mb-0">الكلية التقنية الهندسية كركوك / تصميم و برمجة : المبرمج مصطفى هاشم قاسم</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
